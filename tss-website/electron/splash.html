<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<title>Two Steps Studio</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .logo {
    width: 96px;
    height: 96px;
    object-fit: contain;
    opacity: 0;
    animation: fade-in 0.4s ease-out forwards;
  }
  .title {
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0;
    animation: fade-in 0.4s ease-out 0.1s forwards;
  }
  .spinner {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid rgba(27, 189, 189, 0.2);
    border-top-color: #1bbdbd;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes fade-in {
    to { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" id="logo" alt="" />
    <div class="title">Two Steps Studio</div>
    <div class="spinner"></div>
  </div>
  <script>
    // Logo is passed as an already-encoded file:// URL (see
    // createSplashWindow() in main.js, pathToFileURL) rather than
    // hardcoded here - resolveAppAsset() handles the dev/unpackaged/
    // packaged path differences for it.
    const logoUrl = new URLSearchParams(location.search).get("logo");
    if (logoUrl) {
      document.getElementById("logo").src = logoUrl;
    }
  </script>
</body>
</html>
